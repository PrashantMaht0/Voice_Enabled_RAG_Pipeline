services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./vectordb:/app/vectordb
    depends_on:
      ollama:
        condition: service_healthy

  ui:
    build: .
    command: python app.py
    ports:
      - "7860:7860"
    environment:
      VRAG_API_BASE: http://api:8000/api
    depends_on:
      - api

volumes:
  ollama_models:
