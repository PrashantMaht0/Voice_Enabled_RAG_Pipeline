name: Live demo (GitHub Pages)

# Builds demo/ and publishes it to GitHub Pages. The sample index, config.json and
# suggested answers are committed under demo/public (built on a machine with Ollama by demo/scripts/); this job only
# bundles the shared Python core into py.zip and builds the site.
on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/pipeline/**"
      - "src/demo_index.py"
      - "src/prompts/**"
      - "src/utils/**"
      - "src/verification/**"
      - "src/observability/**"
      - "tests/pipeline/**"
      - ".github/workflows/demo_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pyodide_core:
    name: Answer core in Pyodide
    # The site ships this core; it deploys only when the core's tests pass in the browser's Python runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run the core tests in Pyodide
        run: |
          npm --prefix demo/pyodide-runner ci
          npm --prefix demo/pyodide-runner test

  build:
    needs: pyodide_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Build the site
        working-directory: demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build
          # A worker Vite did not recognise ships as raw TypeScript, which Pages serves as video/mp2t
          if ls dist/assets/*.ts >/dev/null 2>&1; then echo "Raw .ts files in dist/assets:"; ls dist/assets/*.ts; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
