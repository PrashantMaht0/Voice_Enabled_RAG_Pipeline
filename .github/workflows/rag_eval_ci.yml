name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # The integration marker needs Qdrant, Tantivy and the embedding model
        # on disk; ragas_ci needs a local Ollama judge. Neither fits a hosted runner.
        run: pytest -m "not integration and not ragas_ci" -q

  pyodide_core:
    name: Answer core in Pyodide
    # The browser demo runs src/pipeline in Pyodide (spec 0009); the same core tests must pass there too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run the core tests in Pyodide
        run: |
          npm --prefix demo/pyodide-runner ci
          npm --prefix demo/pyodide-runner test

  ragas_gate:
    name: Ragas quality gate (self-hosted / manual)
    runs-on: ubuntu-latest
    # Requires Ollama, the built index and the API server, so it never runs on a
    # hosted runner. Trigger it deliberately from a machine that has them.
    if: github.event_name == 'workflow_dispatch'
    steps:
      # First, so a runner without Ollama or the API stops in seconds, before installing anything
      - name: Check Ollama and the API are reachable
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          url = urllib.parse.urlsplit(os.environ.get("VRAG_API_URL", "http://localhost:8000/api/query"))
          health = f"{url.scheme}://{url.netloc}/api/health"
          try:
              status = json.load(urllib.request.urlopen(health, timeout=5)).get("ollama_status")
          except Exception as e:
              sys.exit(f"The V-RAG API is not reachable at {health} ({e}). "
                       "Run this job on a machine with Ollama, the built index and the API server.")
          if status != "online":
              sys.exit(f"The API is up but Ollama is {status!r}. Run this job on a machine with Ollama running.")
          print("Ollama and the API are reachable.")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          # Versions of the recorded passing gate; kept apart from requirements.txt (installing both breaks ragas)
          pip install ragas==0.2.15 langchain==0.3.30 langchain-core==0.3.86 langchain-community==0.3.27 \
            langchain-openai==0.2.14 langchain-ollama==0.2.3 datasets==5.0.1 pandas==3.0.5 \
            pytest==9.1.1 requests==2.34.2

      - name: Ragas thresholds (faithfulness 0.85 / relevancy 0.85)
        run: pytest tests/eval_test.py -m ragas_ci -q -s
